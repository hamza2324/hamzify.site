name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages and to mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type and lint errors fail the deploy rather than shipping quietly.
      - run: npm run check

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hamzify.site

      # GitHub Pages would otherwise hand the output to Jekyll, which skips
      # every directory starting with an underscore — including `_next`.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
