name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages and to mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` requires a lockfile that lists optional native packages for
      # Linux. A lockfile generated on Windows can omit those (e.g. @emnapi/*),
      # which is what failed the first deploy. `npm install` still uses the
      # lockfile, but can fill the platform gaps so the Next.js build can run.
      - run: npm install --no-audit --no-fund

      - run: npm run check

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hamzify.site
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: https://formspree.io/f/xzepjobl
          NEXT_PUBLIC_CONTACT_ENDPOINT: https://formspree.io/f/xzepjobl

      # GitHub Pages would otherwise hand the output to Jekyll, which skips
      # every directory starting with an underscore — including `_next`.
      - run: touch out/.nojekyll

      # Sanity: the published root must contain index.html. That file is built
      # here, not committed to the repo — the repo is the Next.js source.
      - run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/CNAME
          test -f out/sitemap.xml
          test ! -d out/sitemap.xml
          test -f out/robots.txt
          test -f out/llms.txt
          test -f out/rss.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
